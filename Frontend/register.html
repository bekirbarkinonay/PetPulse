<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PetPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card p-4 shadow-sm" style="width: 400px;">
        <h3 class="text-center mb-4">Create Account</h3>
        <form id="registerForm">
            <input type="text" id="regFirstName" class="form-control mb-3" placeholder="First Name" required>
            <input type="text" id="regLastName" class="form-control mb-3" placeholder="Last Name" required>
            
            <input type="email" id="regEmail" class="form-control mb-3" placeholder="Email Address" required>
            <input type="password" id="regPassword" class="form-control mb-3" placeholder="Password" required>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="login.html" class="text-decoration-none">Already have an account? Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Backend'in beklediği yeni modele (İsim, Soyisim dahil) göre veri hazırlıyoruz
            const newUser = {
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: "User" // Güvenlik için varsayılan rol
            };

            try {
                const res = await fetch('httgit pushps://petpulse-api-xz76.onrender.com/api/Auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                if (res.ok) {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                    window.location.href = 'login.html';
                } else {
                    const errorMsg = await res.text();
                    alert("Kayıt başarısız: " + (errorMsg || "Bu e-posta zaten kullanılıyor olabilir."));
                }
            } catch (err) {
                alert("Sunucuya bağlanılamadı. Lütfen Backend API'nin çalıştığından emin olun.");
            }
        });
    </script>
</body>
</html>
