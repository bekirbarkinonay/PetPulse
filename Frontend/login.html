<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card p-4 shadow-sm" style="width: 400px;">
        <h3 class="text-center mb-4">PetPulse Login</h3>
        <form id="loginForm">
            <input type="email" id="email" class="form-control mb-3" placeholder="Email Address" required>
            <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
            <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="register.html" class="text-decoration-none">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Backend'in beklediği küçük harfli alan isimleri
            const loginData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            // YOLU /login OLARAK GÜNCELLEDİK
            const res = await fetch('https://petpulse-api-xz76.onrender.com/api/Auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (res.ok) {
                const data = await res.json();
                
                // Gelen bilgileri tarayıcı hafızasına kaydet
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userName', data.firstName + ' ' + data.lastName);
                
                // Role göre yetkili sayfaya yönlendir
                if (data.role === 'Admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                alert("Giriş başarısız! Lütfen mail veya şifrenizi kontrol edin.");
            }
        });
    </script>
</body>
</html>
